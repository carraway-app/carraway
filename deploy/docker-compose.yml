# One stack per tenant. See README.en.md for setup and upgrades.
name: ${COMPOSE_PROJECT_NAME:-carraway}

x-carraway: &carraway
  image: ${CARRAWAY_IMAGE:-ghcr.io/carraway-app/carraway:0.4.1}
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true

x-runtime: &runtime
  CARRAWAY_UMGEBUNG: ${CARRAWAY_ENVIRONMENT:-${CARRAWAY_UMGEBUNG:?set CARRAWAY_ENVIRONMENT}}
  DATABASE_URL: postgres://${DB_NAME:-carraway}_app:${DB_APP_PASSWORD:-${DB_APP_PASSWORT:?set DB_APP_PASSWORD}}@postgres:5432/${DB_NAME:-carraway}
  PGBOSS_SCHEMA_ANLEGEN: "0"
  LOG_STUFE: ${LOG_LEVEL:-${LOG_STUFE:-info}}

  KI_ANBIETER: ${AI_PROVIDER:-${KI_ANBIETER:-aus}}
  KI_MODELL: ${AI_MODEL:-${KI_MODELL:-}}
  KI_REGION: ${AI_REGION:-${KI_REGION:-}}
  KI_ENDPOINT: ${AI_ENDPOINT:-${KI_ENDPOINT:-}}
  KI_EINGANG_DOMAINS: ${AI_INBOX_DOMAINS:-${KI_EINGANG_DOMAINS:-}}
  KI_EINGANG_ABSENDER: ${AI_INBOX_SENDERS:-${KI_EINGANG_ABSENDER:-}}
  KI_EINGANG_MAX_MB: ${AI_INBOX_MAX_MB:-${KI_EINGANG_MAX_MB:-10}}
  KI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-${KI_TIMEOUT_MS:-}}
  KI_BEDROCK_API_KEY: ${AI_BEDROCK_API_KEY:-${KI_BEDROCK_API_KEY:-}}
  KI_MISTRAL_API_KEY: ${AI_MISTRAL_API_KEY:-${KI_MISTRAL_API_KEY:-}}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_TLS: ${SMTP_TLS:-}
  SMTP_BENUTZER: ${SMTP_USER:-${SMTP_BENUTZER:-}}
  SMTP_PASSWORT: ${SMTP_PASSWORD:-${SMTP_PASSWORT:-}}
  SMTP_PASSWORT_DATEI: ${SMTP_PASSWORD_FILE:-${SMTP_PASSWORT_DATEI:-}}
  SMTP_ABSENDER: ${SMTP_FROM:-${SMTP_ABSENDER:-}}
  MAIL_LIMIT_PRO_STUNDE: ${MAIL_LIMIT_PER_HOUR:-${MAIL_LIMIT_PRO_STUNDE:-}}
  GEHEIMNIS_SCHLUESSEL: ${SECRET_KEY:-${GEHEIMNIS_SCHLUESSEL:-}}
  GEHEIMNIS_SCHLUESSEL_ALT: ${SECRET_KEY_PREVIOUS:-${GEHEIMNIS_SCHLUESSEL_ALT:-}}
  POSTFACH_MICROSOFT_CLIENT_ID: ${MAILBOX_MICROSOFT_CLIENT_ID:-${POSTFACH_MICROSOFT_CLIENT_ID:-}}
  POSTFACH_MICROSOFT_CLIENT_SECRET: ${MAILBOX_MICROSOFT_CLIENT_SECRET:-${POSTFACH_MICROSOFT_CLIENT_SECRET:-}}
  POSTFACH_MICROSOFT_TENANT_ID: ${MAILBOX_MICROSOFT_TENANT_ID:-${POSTFACH_MICROSOFT_TENANT_ID:-}}
  POSTFACH_GOOGLE_CLIENT_ID: ${MAILBOX_GOOGLE_CLIENT_ID:-${POSTFACH_GOOGLE_CLIENT_ID:-}}
  POSTFACH_GOOGLE_CLIENT_SECRET: ${MAILBOX_GOOGLE_CLIENT_SECRET:-${POSTFACH_GOOGLE_CLIENT_SECRET:-}}
  POSTFACH_IMAP: ${MAILBOX_IMAP:-${POSTFACH_IMAP:-}}
  POSTFACH_PRIVATE_ZIELE: ${MAILBOX_PRIVATE_TARGETS:-${POSTFACH_PRIVATE_ZIELE:-}}
  POSTFACH_INTERVALL_MINUTEN: ${MAILBOX_INTERVAL_MINUTES:-${POSTFACH_INTERVALL_MINUTEN:-}}

  DOKUMENT_AUFBEWAHRUNG_TAGE: ${DOCUMENT_RETENTION_DAYS:-${DOKUMENT_AUFBEWAHRUNG_TAGE:-}}
  KAPITAL_SICHT: ${CAPITAL_VIEW:-${KAPITAL_SICHT:-}}

  OCR: ${OCR:-aus}
  OCR_MAX_SEITEN: ${OCR_MAX_PAGES:-${OCR_MAX_SEITEN:-}}
  OCR_ZEITLIMIT_SEKUNDEN: ${OCR_TIMEOUT_SECONDS:-${OCR_ZEITLIMIT_SEKUNDEN:-}}
  OCR_MAX_MEGAPIXEL: ${OCR_MAX_MEGAPIXEL:-}
  REGISTER_ANBIETER: ${REGISTER_PROVIDER:-${REGISTER_ANBIETER:-}}
  REGISTER_TESTDATEI: ${REGISTER_TEST_FILE:-${REGISTER_TESTDATEI:-}}
  REGISTER_PRUEFUNG_CRON: ${REGISTER_CHECK_CRON:-${REGISTER_PRUEFUNG_CRON:-}}
  REGISTER_ABRUFE_PRO_LAUF: ${REGISTER_REQUESTS_PER_RUN:-${REGISTER_ABRUFE_PRO_LAUF:-20}}
  REGISTER_PAUSE_MS: ${REGISTER_PAUSE_MS:-3000}

services:
  postgres:
    image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-${DB_ADMIN_BENUTZER:-carraway_admin}}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-${DB_ADMIN_PASSWORT:?set DB_ADMIN_PASSWORD}}
      POSTGRES_DB: postgres
      DB_NAME: ${DB_NAME:-carraway}
    volumes:
      - datenbank:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb

  carraway-migrate:
    <<: *carraway
    # Migrations do not use document storage. Cover the image volume to avoid anonymous volumes on redeploy.
    tmpfs: [/tmp, /daten/speicher]
    command: ["sh", "-ec", "./bootstrap.sh && exec node dist/migrate.js"]
    restart: "no"
    environment:
      CARRAWAY_UMGEBUNG: ${CARRAWAY_ENVIRONMENT:-${CARRAWAY_UMGEBUNG:?set CARRAWAY_ENVIRONMENT}}
      PGHOST: postgres
      PGUSER: ${DB_ADMIN_USER:-${DB_ADMIN_BENUTZER:-carraway_admin}}
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-${DB_ADMIN_PASSWORT:?set DB_ADMIN_PASSWORD}}
      DB_NAME: ${DB_NAME:-carraway}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-${DB_EIGENTUEMER_PASSWORT:?set DB_OWNER_PASSWORD}}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-${DB_APP_PASSWORT:?set DB_APP_PASSWORD}}
      DATABASE_URL_OWNER: postgres://${DB_NAME:-carraway}_eigentuemer:${DB_OWNER_PASSWORD:-${DB_EIGENTUEMER_PASSWORT:?set DB_OWNER_PASSWORD}}@postgres:5432/${DB_NAME:-carraway}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  carraway:
    <<: *carraway
    restart: unless-stopped
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8787}:8787"
    environment:
      <<: *runtime
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      APP_ORIGIN: ${APP_ORIGIN:?required}
      WEB_AUSLIEFERN: "1"
      PROXY_VERTRAUEN: ${TRUST_PROXY:-${PROXY_VERTRAUEN:-0}}
      ZWEI_FAKTOR_PFLICHT: ${REQUIRE_TWO_FACTOR:-${ZWEI_FAKTOR_PFLICHT:-1}}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      REGISTRIERUNG_OFFEN: ${OPEN_REGISTRATION:-${REGISTRIERUNG_OFFEN:-0}}
      METRIKEN_TOKEN: ${METRICS_TOKEN:-${METRIKEN_TOKEN:-}}
      OIDC_MICROSOFT_CLIENT_ID: ${OIDC_MICROSOFT_CLIENT_ID:-}
      OIDC_MICROSOFT_CLIENT_SECRET: ${OIDC_MICROSOFT_CLIENT_SECRET:-}
      OIDC_MICROSOFT_TENANT_ID: ${OIDC_MICROSOFT_TENANT_ID:-}
      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      OIDC_GOOGLE_KONTEN_VERKNUEPFEN: ${OIDC_GOOGLE_KONTEN_VERKNUEPFEN:-false}
    volumes:
      - speicher:/daten/speicher
    depends_on:
      postgres:
        condition: service_healthy
      carraway-migrate:
        condition: service_completed_successfully

  carraway-worker:
    <<: *carraway
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY:-${WORKER_SPEICHER:-3g}}
    environment:
      <<: *runtime
      NODE_OPTIONS: --max-old-space-size=1536
      WORKER_INTERVALL_MS: ${WORKER_INTERVAL_MS:-${WORKER_INTERVALL_MS:-2000}}
      WORKER_HERZSCHLAG_MS: ${WORKER_HEARTBEAT_MS:-${WORKER_HERZSCHLAG_MS:-5000}}
    volumes:
      - speicher:/daten/speicher
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('node:fs').statSync('/tmp/carraway-worker-herzschlag').mtimeMs<30000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      carraway-migrate:
        condition: service_completed_successfully

# Keep the original volume keys. Compose scopes both names to the existing project.
volumes:
  datenbank:
  speicher:
