name: CI

# Öffentliche CI des Kerns: installieren, Lint, Typecheck, Build, Tests. Läuft auf GitHub-Runnern (ubuntu).
# Diese Datei stammt aus scripts/oss/oeffentlich/ des privaten Repos und wird beim Export ersetzt.
on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "11.13.0"
  NODE_VERSION: "24.22.2"
  DATABASE_URL_TEST: postgres://carraway:carraway@localhost:5432/carraway_ci_test
  DATABASE_URL_SUPERUSER: postgres://postgres:postgres@localhost:5432/postgres
  TEST_DB_WORKERS: "3"

jobs:
  ci:
    name: lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrationen geordnet
        run: pnpm migrationen:pruefen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        # GitHub-Runner haben wenig Speicher; die Pakete nacheinander und mit größerem Heap prüfen.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm -r --workspace-concurrency=1 typecheck

      - name: Build
        run: pnpm build

      - name: Prepare test database
        run: pnpm --filter @carraway/db setup:test

      - name: Test
        # Leistungstests messen Zeiten und sind auf geteilten GitHub-Runnern nicht aussagekräftig.
        env:
          SKIP_PERF: "1"
        run: pnpm test

      - name: Build the release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: docker build --tag carraway:release-candidate .

      - name: Install Chromium for release checks
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: pnpm exec playwright-core install chromium --with-deps --only-shell --no-progress

      - name: Check the release image in the browser
        id: browser
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        timeout-minutes: 8
        run: bash scripts/abnahme/kern-image.sh carraway:release-candidate "$RUNNER_TEMP/browser-abnahme-kern"

      - name: Upload browser check results
        if: always() && steps.browser.conclusion != 'skipped' && steps.browser.conclusion != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-abnahme-kern
          path: ${{ runner.temp }}/browser-abnahme-kern/
          retention-days: 14
